name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: lassetvedegaard/cloudwebapp-api

    steps:
      # Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Docker image (IMPORTANT: context is ".")
      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} -f Test_REST_Service/Dockerfile .

      # Push image to Docker Hub
      - name: Push Docker image
        run: docker push $IMAGE_NAME:${{ github.sha }}

      # Deploy to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: api-cloudwebapp-prd
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: $IMAGE_NAME:${{ github.sha }}
