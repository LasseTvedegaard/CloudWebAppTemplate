name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: lassetvedegaard/cloudwebapp-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # Login to Docker Hub
      # -------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -------------------------
      # Build image
      # -------------------------
      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:latest -f Test_REST_Service/Dockerfile .

      # -------------------------
      # Push image
      # -------------------------
      - name: Push Docker image
        run: docker push $IMAGE_NAME:latest

      # -------------------------
      # Azure login
      # -------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # -------------------------
      # Deploy to Azure Web App
      # IMPORTANT: Full image path required
      # -------------------------
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: api-cloudwebapp-prd
          images: index.docker.io/lassetvedegaard/cloudwebapp-api:latest
